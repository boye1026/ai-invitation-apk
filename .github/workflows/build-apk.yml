name: Build Android APK

# 触发条件：推送到main分支或创建Pull Request时
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 防止构建无限运行

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置Java环境（Android官方推荐JDK 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置Android SDK（自动安装所需的构建工具和平台）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. 设置Gradle并自动缓存（构建速度提升50%-80%）
      # 自动处理gradlew权限问题，无需手动chmod
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }} # 仅main分支写入缓存

      # 5. 运行Lint检查（可选但推荐）
      - name: Run Lint
        run: ./gradlew lintDebug

      # 6. 运行单元测试（可选但推荐）
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 7. 构建Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 8. 上传构建产物
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30 # 保留30天
