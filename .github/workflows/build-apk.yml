name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    
    # 修复 build.gradle
    - name: Fix build.gradle
      run: |
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace "com.ai.invitation"
            compileSdk 34
        
            defaultConfig {
                applicationId "com.ai.invitation"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF
    
    # 升级 Gradle
    - name: Upgrade Gradle wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
    
    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          cat > gradlew << 'GRADLEW'
        #!/bin/sh
        exec gradle "$@"
        GRADLEW
          chmod +x gradlew
        fi
    
    # 删除有问题的 Java 文件并创建干净的代码
    - name: Clean and create source files
      run: |
        # 删除所有现有的 Java 文件
        rm -rf app/src/main/java/com/ai/invitation/*.java 2>/dev/null || true
        
        # 创建目录
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/java/com/ai/invitation
        
        # 创建 strings.xml
        cat > app/src/main/res/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">AI Invitation</string>
        </resources>
        EOF
        
        # 创建 AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        
        </manifest>
        EOF
        
        # 创建干净的 MainActivity (WebView版本)
        cat > app/src/main/java/com/ai/invitation/MainActivity.java << 'EOF'
        package com.ai.invitation;
        
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;
        
        public class MainActivity extends AppCompatActivity {
            private WebView webView;
        
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
        
                webView = findViewById(R.id.webview);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webSettings.setAllowFileAccessFromFileURLs(true);
        
                webView.addJavascriptInterface(new WebAppInterface(this), "Android");
                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onPageFinished(WebView view, String url) {
                        super.onPageFinished(view, url);
                    }
                    
                    @Override
                    public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                        android.util.Log.e("WebView", "Error: " + description);
                    }
                });
                
                // 从assets加载HTML文件
                webView.loadUrl("file:///android_asset/index.html");
            }
        
            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF
        
        # 创建 WebAppInterface.java
        cat > app/src/main/java/com/ai/invitation/WebAppInterface.java << 'EOF'
        package com.ai.invitation;
        
        import android.content.Context;
        import android.content.ClipData;
        import android.content.ClipboardManager;
        import android.widget.Toast;
        import androidx.webkit.JavaScriptInterface;
        
        public class WebAppInterface {
            Context mContext;
        
            WebAppInterface(Context c) {
                mContext = c;
            }
        
            @JavaScriptInterface
            public void copyToClipboard(String text) {
                ClipboardManager clipboard = (ClipboardManager) mContext.getSystemService(Context.CLIPBOARD_SERVICE);
                ClipData clip = ClipData.newPlainText("文案", text);
                clipboard.setPrimaryClip(clip);
                Toast.makeText(mContext, "已复制到剪贴板", Toast.LENGTH_SHORT).show();
            }
        }
        EOF
        
        # 创建 activity_main.xml
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent">
        
            <WebView
                android:id="@+id/webview"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
        
        </LinearLayout>
        EOF
        
        # 创建空的图标目录和有效的最小 PNG
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        
        # 有效的 1x1 透明 PNG
        ICON_BASE64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
        for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          echo "$ICON_BASE64" | base64 -d > app/src/main/res/$dir/ic_launcher.png
          cp app/src/main/res/$dir/ic_launcher.png app/src/main/res/$dir/ic_launcher_round.png
        done
    
    # 复制 assets 文件（关键修复步骤）
    - name: Copy assets files
      run: |
        # 创建 assets 目录
        mkdir -p app/src/main/assets
        
        # 检查并复制 index.html
        if [ -f "index.html" ]; then
          cp index.html app/src/main/assets/
          echo "✅ index.html 已复制到 assets 目录"
        elif [ -f "app/src/main/assets/index.html" ]; then
          echo "✅ index.html 已存在于 assets 目录"
        else
          echo "❌ 错误: 找不到 index.html 文件!"
          echo "当前目录内容:"
          ls -la
          exit 1
        fi
        
        # 验证文件是否成功复制
        echo "=== Assets 目录验证 ==="
        ls -la app/src/main/assets/
        
        # 显示 HTML 文件的前几行（调试用）
        if [ -f "app/src/main/assets/index.html" ]; then
          echo "=== index.html 内容预览 ==="
          head -n 10 app/src/main/assets/index.html
        fi
    
    # 移除 BOM 并添加配置
    - name: Remove BOM and configure
      run: |
        find app/src -name "*.java" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \; 2>/dev/null || true
        find app/src -name "*.xml" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \; 2>/dev/null || true
        sed -i '1s/^\xEF\xBB\xBF//' app/build.gradle 2>/dev/null || true
        
        # 添加 gradle.properties
        cat >> gradle.properties << 'EOF'
        android.suppressUnsupportedCompileSdk=34
        EOF
        
        echo "=== Java files ==="
        find app/src -name "*.java" -type f
        echo "=== XML files ==="
        find app/src -name "*.xml" -type f
        echo "=== Assets files ==="
        find app/src -name "*.html" -type f
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
