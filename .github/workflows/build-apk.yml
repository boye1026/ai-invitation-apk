name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    
    # 修复 build.gradle
    - name: Fix build.gradle
      run: |
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace "com.ai.invitation"
            compileSdk 34
        
            defaultConfig {
                applicationId "com.ai.invitation"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF
    
    # 升级 Gradle
    - name: Upgrade Gradle wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
    
    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          cat > gradlew << 'GRADLEW'
        #!/bin/sh
        exec gradle "$@"
        GRADLEW
          chmod +x gradlew
        fi
    
    # 生成漂亮的渐变图标
    - name: Generate beautiful app icons
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick librsvg2-bin
        
        cat > icon.svg << 'EOF'
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#667eea"/>
              <stop offset="100%" style="stop-color:#764ba2"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="96" fill="url(#grad)"/>
          <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="20"/>
          <text x="256" y="340" font-size="200" text-anchor="middle" fill="white" font-family="sans-serif">✉</text>
          <text x="256" y="180" font-size="60" text-anchor="middle" fill="#FFD700" font-family="sans-serif" font-weight="bold">AI</text>
          <circle cx="128" cy="128" r="8" fill="white" opacity="0.3"/>
          <circle cx="384" cy="384" r="12" fill="white" opacity="0.3"/>
          <circle cx="400" cy="120" r="6" fill="white" opacity="0.2"/>
        </svg>
        EOF
        
        for size in 48 72 96 144 192; do
          case $size in
            48) dir="mipmap-mdpi" ;;
            72) dir="mipmap-hdpi" ;;
            96) dir="mipmap-xhdpi" ;;
            144) dir="mipmap-xxhdpi" ;;
            192) dir="mipmap-xxxhdpi" ;;
          esac
          mkdir -p app/src/main/res/$dir
          rsvg-convert -w $size -h $size icon.svg > app/src/main/res/$dir/ic_launcher.png
          cp app/src/main/res/$dir/ic_launcher.png app/src/main/res/$dir/ic_launcher_round.png
        done
        
        rm icon.svg
        echo "✅ 漂亮图标生成完成"
    
    # 创建所有必要的Android文件
    - name: Create Android source files
      run: |
        # 创建目录结构
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/java/com/ai/invitation
        
        # 创建 strings.xml
        cat > app/src/main/res/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">AI邀请函</string>
        </resources>
        EOF
        
        # 创建 themes.xml
        cat > app/src/main/res/values/themes.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.AIInvitationGenerator" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="colorPrimary">#667eea</item>
                <item name="colorPrimaryDark">#764ba2</item>
                <item name="colorAccent">#FF9800</item>
                <item name="android:windowBackground">@color/white</item>
            </style>
        </resources>
        EOF
        
        # 创建 colors.xml
        cat > app/src/main/res/values/colors.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="purple_500">#667eea</color>
            <color name="purple_700">#764ba2</color>
            <color name="white">#FFFFFF</color>
        </resources>
        EOF
        
        # 创建 AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.AIInvitationGenerator"
                android:usesCleartextTraffic="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        
        </manifest>
        EOF
        
        # 创建 activity_main.xml
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent">
        
            <WebView
                android:id="@+id/webview"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
        
        </LinearLayout>
        EOF
        
        # 创建 MainActivity.java
        cat > app/src/main/java/com/ai/invitation/MainActivity.java << 'EOF'
        package com.ai.invitation;
        
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebChromeClient;
        import androidx.appcompat.app.AppCompatActivity;
        
        public class MainActivity extends AppCompatActivity {
            private WebView webView;
        
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
        
                webView = findViewById(R.id.webview);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webSettings.setLoadWithOverviewMode(true);
                webSettings.setUseWideViewPort(true);
                webSettings.setBuiltInZoomControls(true);
                webSettings.setDisplayZoomControls(false);
                
                if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.KITKAT) {
                    webSettings.setAllowFileAccessFromFileURLs(true);
                    webSettings.setAllowUniversalAccessFromFileURLs(true);
                }
        
                webView.addJavascriptInterface(new WebAppInterface(this), "Android");
                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onPageFinished(WebView view, String url) {
                        super.onPageFinished(view, url);
                    }
                    
                    @Override
                    public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                        android.util.Log.e("WebView", "Error: " + description);
                    }
                });
                webView.setWebChromeClient(new WebChromeClient());
                
                webView.loadUrl("file:///android_asset/index.html");
            }
        
            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF
        
        # 创建 WebAppInterface.java
        cat > app/src/main/java/com/ai/invitation/WebAppInterface.java << 'EOF'
        package com.ai.invitation;
        
        import android.content.Context;
        import android.content.ClipData;
        import android.content.ClipboardManager;
        import android.widget.Toast;
        import android.webkit.JavascriptInterface;
        
        public class WebAppInterface {
            Context mContext;
        
            WebAppInterface(Context c) {
                mContext = c;
            }
        
            @JavascriptInterface
            public void copyToClipboard(String text) {
                ClipboardManager clipboard = (ClipboardManager) mContext.getSystemService(Context.CLIPBOARD_SERVICE);
                ClipData clip = ClipData.newPlainText("文案", text);
                clipboard.setPrimaryClip(clip);
                Toast.makeText(mContext, "已复制到剪贴板", Toast.LENGTH_SHORT).show();
            }
        }
        EOF
    
    # 复制 HTML 文件到 assets（修复语法错误）
    - name: Copy HTML to assets
      run: |
        # 创建 assets 目录
        mkdir -p app/src/main/assets
        
        # 尝试多个可能的位置查找 index.html
        if [ -f "index.html" ]; then
          cp index.html app/src/main/assets/
          echo "✅ index.html 从根目录复制到 assets"
        elif [ -f "app/src/main/assets/index.html" ]; then
          echo "✅ index.html 已存在于 assets 目录"
        elif [ -f "app/src/main/res/raw/index.html" ]; then
          cp app/src/main/res/raw/index.html app/src/main/assets/
          echo "✅ index.html 从 res/raw 复制到 assets"
        elif [ -f "app/assets/index.html" ]; then
          cp app/assets/index.html app/src/main/assets/
          echo "✅ index.html 从 app/assets 复制到 assets"
        else
          echo "⚠️ 警告: 找不到 index.html 文件，将创建一个默认的 HTML 文件"
          
          # 创建默认的 HTML 文件（使用 echo 多行方式，避免 here-document 问题）
          echo '<!DOCTYPE html>' > app/src/main/assets/index.html
          echo '<html>' >> app/src/main/assets/index.html
          echo '<head>' >> app/src/main/assets/index.html
          echo '    <meta charset="UTF-8">' >> app/src/main/assets/index.html
          echo '    <meta name="viewport" content="width=device-width, initial-scale=1.0">' >> app/src/main/assets/index.html
          echo '    <title>AI邀请函</title>' >> app/src/main/assets/index.html
          echo '    <style>' >> app/src/main/assets/index.html
          echo '        body {' >> app/src/main/assets/index.html
          echo '            margin: 0;' >> app/src/main/assets/index.html
          echo '            padding: 20px;' >> app/src/main/assets/index.html
          echo '            font-family: system-ui, -apple-system, sans-serif;' >> app/src/main/assets/index.html
          echo '            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);' >> app/src/main/assets/index.html
          echo '            color: white;' >> app/src/main/assets/index.html
          echo '            text-align: center;' >> app/src/main/assets/index.html
          echo '            min-height: 100vh;' >> app/src/main/assets/index.html
          echo '            display: flex;' >> app/src/main/assets/index.html
          echo '            align-items: center;' >> app/src/main/assets/index.html
          echo '            justify-content: center;' >> app/src/main/assets/index.html
          echo '        }' >> app/src/main/assets/index.html
          echo '        .container {' >> app/src/main/assets/index.html
          echo '            max-width: 600px;' >> app/src/main/assets/index.html
          echo '            margin: 0 auto;' >> app/src/main/assets/index.html
          echo '        }' >> app/src/main/assets/index.html
          echo '        h1 {' >> app/src/main/assets/index.html
          echo '            font-size: 2em;' >> app/src/main/assets/index.html
          echo '            margin-bottom: 20px;' >> app/src/main/assets/index.html
          echo '        }' >> app/src/main/assets/index.html
          echo '        .icon {' >> app/src/main/assets/index.html
          echo '            font-size: 80px;' >> app/src/main/assets/index.html
          echo '            margin-bottom: 20px;' >> app/src/main/assets/index.html
          echo '        }' >> app/src/main/assets/index.html
          echo '        .message {' >> app/src/main/assets/index.html
          echo '            background: rgba(255,255,255,0.2);' >> app/src/main/assets/index.html
          echo '            padding: 20px;' >> app/src/main/assets/index.html
          echo '            border-radius: 20px;' >> app/src/main/assets/index.html
          echo '            margin-top: 20px;' >> app/src/main/assets/index.html
          echo '        }' >> app/src/main/assets/index.html
          echo '    </style>' >> app/src/main/assets/index.html
          echo '</head>' >> app/src/main/assets/index.html
          echo '<body>' >> app/src/main/assets/index.html
          echo '    <div class="container">' >> app/src/main/assets/index.html
          echo '        <div class="icon">✨</div>' >> app/src/main/assets/index.html
          echo '        <h1>AI邀请函</h1>' >> app/src/main/assets/index.html
          echo '        <div class="message">' >> app/src/main/assets/index.html
          echo '            <p>AI邀请函文案生成器</p>' >> app/src/main/assets/index.html
          echo '            <p>请将完整的 index.html 文件放置到 assets 目录</p>' >> app/src/main/assets/index.html
          echo '        </div>' >> app/src/main/assets/index.html
          echo '    </div>' >> app/src/main/assets/index.html
          echo '</body>' >> app/src/main/assets/index.html
          echo '</html>' >> app/src/main/assets/index.html
          
          echo "✅ 已创建默认的 index.html 文件"
        fi
        
        # 验证文件是否成功创建
        echo "=== Assets 目录验证 ==="
        ls -la app/src/main/assets/
        
        if [ -f "app/src/main/assets/index.html" ]; then
          echo "✅ HTML 文件已成功放置"
          echo "文件大小: $(wc -c < app/src/main/assets/index.html) bytes"
        else
          echo "❌ 错误: 无法创建 index.html 文件"
          exit 1
        fi
    
    # 移除 BOM 并添加配置
    - name: Final configuration
      run: |
        find app/src -name "*.java" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \; 2>/dev/null || true
        find app/src -name "*.xml" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \; 2>/dev/null || true
        
        cat >> gradle.properties << 'EOF'
        android.suppressUnsupportedCompileSdk=34
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
        
        echo "=== 项目文件验证 ==="
        echo "Java files:"
        find app/src -name "*.java" -type f
        echo "XML files:"
        find app/src -name "*.xml" -type f
        echo "Assets files:"
        find app/src -name "*.html" -type f
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Invitation-App
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
